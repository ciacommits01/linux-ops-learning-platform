 const needs=stages.some(s=>{const ws=s.st.w.filter(w=>!/^[A-Za-z_]\w*=/.test(w));const sd=ws[0]==='sudo';const cmd=(sd?ws.filter((w,i)=>i>0&&!w.startsWith('-'))[0]:ws[0])||'';const b=cmd.replace(/^.*\//,'');const sub=(sd?ws.filter((w,i)=>i>0&&!w.startsWith('-')):ws)[1]||'';if(sd)return false;if(ROOTCMD.test(b))return !(b==='apt'&&/^(list|search|show|policy)$/.test(sub))&&!(/^(pvs|vgs|lvs)$/.test(b)&&false);if(b==='systemctl')return /^(start|stop|restart|reload|enable|disable|mask|unmask|daemon-reload|reset-failed)$/.test(sub);if(b==='ip')return /\b(add|del|set)\b/.test(value);return false;});
 if(needs&&!isRoot())warns.unshift('🔑 This needs root: prefix the command with sudo.');
 redirOut&&redirOut.op==='>'&&existsP(redirOut.t)&&sizeOf(getN(redirOut.t))>0&&warns.push(`⚠️ > will OVERWRITE ${redirOut.t}. Use >> to append.`);
 warn.innerHTML=warns.map(esc).join('<br>');warn.hidden=!warns.length;tipx.textContent=ref&&ref.tip?'💡 '+ref.tip:'';}

/* ---------- dashboard ---------- */
const TABS=['Processes','Network','Disks','Users','Services'];
function gauge(l,v,txt,warnAt,badAt){const cls=v>=badAt?'bad':v>=warnAt?'warn':'';return `<div class="gauge ${cls}"><b>${l}</b><div class="v">${txt}</div><div class="m"><i style="width:${Math.min(100,v)}%"></i></div></div>`;}
function renderGauges(){const m=metrics();$('#gauges').innerHTML=gauge('CPU',m.cpu,Math.round(m.cpu)+'%',60,85)+gauge('LOAD (2 cores)',m.load/2*100,m.load.toFixed(2),70,100)+gauge('MEMORY',m.mem,Math.round(m.mem)+'%',75,90)+gauge('DISK '+m.diskMount,m.disk,Math.round(m.disk)+'%',80,90)+gauge('FAILED UNITS',m.failed?100:0,String(m.failed),1,1)+gauge('LISTENING PORTS',Math.min(100,m.ports*8),String(m.ports),999,999);}
function renderPanel(){const t=S.tab;$('#tabs').innerHTML=TABS.map(x=>`<button class="${x===t?'on':''}" data-tab="${x}">${x}</button>`).join('');let h='';
 if(t==='Processes'){const rows=W.procs.slice().sort((a,b)=>b.cpu-a.cpu||b.rss-a.rss).slice(0,9);h=`<table><tr><th>PID</th><th>USER</th><th>%CPU</th><th>RSS</th><th>S</th><th>COMMAND</th></tr>${rows.map(p=>`<tr><td>${p.pid}</td><td>${esc(p.user)}</td><td>${p.cpu.toFixed(1)}</td><td>${hsize(p.rss*1024)}</td><td>${p.st}</td><td>${esc(p.args.slice(0,48))}</td></tr>`).join('')}</table>`;}
 else if(t==='Network'){const r=W.net.routes.find(x=>x.dst==='default');h=`<div>${W.net.ifaces.map(i=>`<span class="chipx ${i.up?'ok':'off'}">${i.name} ${i.up?'UP':'DOWN'} ${esc(i.addrs[0]||'')}</span>`).join('')}</div><div style="margin:3px 0">gateway: <b>${r?esc(r.via):'none'}</b> · dns: <b>${esc(nameservers().join(', ')||'none')}</b> · firewall: <b>${W.fw.ufw.on?'ufw on':'ufw off'}</b>, ${W.fw.rules.length} iptables rules${W.fw.pol.INPUT!=='ACCEPT'?', INPUT policy '+W.fw.pol.INPUT:''}</div><table><tr><th>PORT</th><th>ADDR</th><th>PROC</th><th>PID</th></tr>${listening().filter(l=>!l.v6).map(l=>`<tr><td>${l.port}/${l.proto}</td><td>${esc(l.addr)}</td><td>${esc(commOf(l.proc))}</td><td>${l.proc.pid}</td></tr>`).join('')}</table>`;}
 else if(t==='Disks'){h=Object.keys(W.mounts).map(m=>{const M=W.mounts[m],u=usedBytes(m),p=u/M.size*100,ip=usedInodes(m)/M.inodes*100;return `<div class="dbar ${p>90?'bad':p>80?'warn':''}"><span>${esc(m)}</span><div class="m"><i style="width:${Math.min(100,p)}%"></i></div><b>${Math.round(p)}%</b><small>${hsize(u)}/${hsize(M.size)} · inodes ${Math.round(ip)}%${M.ro?' · READ-ONLY':''}</small></div>`;}).join('')+`<div style="margin-top:4px">LVM: vg0 free <b>${hsize(freeVG())}</b> · lv data <b>${hsize(W.lvm.lv.data.size)}</b></div>`;}
 else if(t==='Users'){const sh=getShadow();h=`<div style="margin-bottom:4px">you: <b>${esc(W.user)}</b> (${esc(userGroups(W.user).join(', '))})</div><table><tr><th>USER</th><th>UID</th><th>GROUPS</th><th>STATE</th></tr>${getUsers().filter(u=>u.uid>=1000||u.uid===0).map(u=>{const s=sh.find(x=>x.n===u.n);const lock=s&&s.h.startsWith('!'),exp=s&&s.exp&&+s.exp<dayNow();return `<tr><td>${esc(u.n)}</td><td>${u.uid}</td><td>${esc(userGroups(u.n).join(','))}</td><td>${lock?'🔒 locked ':''}${exp?'⌛ expired':''}${!lock&&!exp?'ok':''}</td></tr>`;}).join('')}</table>`;}
 else{h=Object.values(W.svc).map(s=>`<span class="chipx ${s.state==='active'?'ok':s.state==='failed'?'bad':'off'}">${esc(s.name)} · ${s.state}${s.enabled?'':' · disabled'}</span>`).join('');}
 $('#panel').innerHTML=h;}
function renderAll(){renderGauges();renderPanel();renderPrompt();liveExplain($('#cmd').value);}

/* ---------- tab completion & chips ---------- */
const CHIPS=['systemctl status ','ss -tulpn','df -h','ps aux --sort=-%cpu | head','journalctl -xe -n 20','ip -br a','sudo ','help'];
function renderChips(){$('#chips').innerHTML=CHIPS.map(c=>`<button data-ins="${esc(c)}">${esc(c.trim())}</button>`).join('');}
function insert(t){const i=$('#cmd');i.value=t;i.focus();liveExplain(i.value);}
function complete(){const i=$('#cmd'),v=i.value;const word=(v.match(/(\S*)$/)||['',''])[1],before=v.slice(0,v.length-word.length);const first=!before.trim()||/[|;&]\s*$/.test(before)||/^\s*sudo\s+$/.test(before);let pool=[];
 if(first)pool=uniq([...Object.keys(CMD),...Object.keys(BUILTIN),...Object.keys(W.funcs),...Object.keys(W.aliases)].filter(c=>!c.includes('_')));
 else if(/systemctl\s+\w*\s*$/.test(before)||/(journalctl\s.*-u|service)\s*$/.test(before))pool=Object.keys(W.svc);
 else{const dirp=word.includes('/')?word.slice(0,word.lastIndexOf('/')+1):'';try{const d=dirp===''?'.':dirp;pool=lsDir(d).map(n=>dirp+n+(isDirP(dirp+n)?'/':''));}catch(e){pool=[];}if(!dirp)pool=[...pool,...Object.keys(W.svc),...getUsers().map(u=>u.n)];}
 const hits=uniq(pool).filter(p=>p.startsWith(word)&&p!==word).sort();if(!hits.length)return;
 if(hits.length===1){i.value=before+hits[0]+(hits[0].endsWith('/')?'':' ');}else{let c=hits[0];for(const h of hits)while(!h.startsWith(c))c=c.slice(0,-1);if(c.length>word.length)i.value=before+c;else printText(hits.slice(0,40).join('   ')+'\n','dim');}liveExplain(i.value);}

/* ---------- command book ---------- */
function fsHTML(){const sel=FSDIRS.find(d=>d.p===S.fsSel)||FSDIRS[0];const groups=['Programs','Configuration','Changing data','People','Hardware & kernel','Boot & mounts'];
 let n=null;try{n=W.fs[sel.p];}catch(e){}let live='';try{const names=lsDir(sel.p);live=names.length?names.slice(0,16).join('   ')+(names.length>16?'   … ('+names.length+' entries)':''):'(empty)';}catch(e){live='(not readable as your user)';}
 const meta=n?`${modeStr(n)}  ${n.u}:${n.g}${n.t==='l'?'  → '+n.tg:''}`:'';
 let h=`<p style="font-weight:700;max-width:820px">Linux has <b>one</b> directory tree starting at <code>/</code>. Every folder has a conventional purpose (the Filesystem Hierarchy Standard), so you can find things on any server. Click a folder to learn what it is, why it exists, and peek inside the practice server.</p><pre class="fstree">${esc(FSTREE)}</pre>`;
 groups.forEach(g=>{h+=`<div class="fsg"><h4>${g}</h4>${FSDIRS.filter(d=>d.g===g).map(d=>`<button class="fsb ${d.p===sel.p?'on':''}" data-fs="${esc(d.p)}">${esc(d.p)}<small>${esc(d.nm)}</small></button>`).join('')}</div>`;});
 h+=`<div class="card fsd"><h2><code>${esc(sel.p)}</code></h2><div class="means">${esc(sel.means)}</div><p class="why">${esc(sel.why)}</p><div class="rule">📌 ${esc(sel.rule)}</div>`;
 if(sel.items.length)h+=`<table>${sel.items.map(([p,d,c])=>`<tr><td>${esc(p)}</td><td>${esc(d)}</td><td>${c?`<button class="btn sm mint" data-try="${esc(c)}">Try</button>`:''}</td></tr>`).join('')}</table>`;
 h+=`<div class="fslive"><b>Live on this server:</b> ${esc(meta)}<br>${esc(live)}</div><div class="row">${sel.try.map(c=>`<button class="btn sm sky" data-try="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`;
 h+=`<h3 style="margin:16px 0 6px">Where would I look for…?</h3><div class="card fsd"><table>${WHERE.map(([q,a,c])=>`<tr><td style="white-space:normal">${esc(q)}</td><td>${esc(a)}</td><td><button class="btn sm ghost" data-try="${esc(c)}">Try</button></td></tr>`).join('')}</table></div>`;
 h+=`<h3 style="margin:16px 0 6px">Common confusions</h3><div class="fsq">${CONFUSE.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div><p style="margin-top:14px"><button class="btn mint" data-quiz="w0">Take the filesystem quiz</button> <button class="btn pink" data-q="fsetc">Start the Filesystem Tour missions</button></p>`;return h;}
function renderBook(){const cats=['All',...uniq(REF.map(x=>x.c))];let h=`<div class="tabs"><button class="btn ${S.bookTab==='fs'?'':'ghost'}" data-btab="fs" style="padding:4px 12px">🗺️ Filesystem map</button><button class="btn ${S.bookTab==='cmds'?'':'ghost'}" data-btab="cmds" style="padding:4px 12px">Commands (${REF.length})</button><button class="btn ${S.bookTab==='concepts'?'':'ghost'}" data-btab="concepts" style="padding:4px 12px">Concepts (${CONCEPTS.length})</button><button class="btn ${S.bookTab==='known'?'':'ghost'}" data-btab="known" style="padding:4px 12px">You already know</button></div>`;
 if(S.bookTab==='fs'){h+=fsHTML();}
 else if(S.bookTab==='cmds'){const q=S.bookQ.toLowerCase();const list=REF.filter(x=>(S.bookCat==='All'||x.c===S.bookCat)&&(!q||(x.n+' '+x.d).toLowerCase().includes(q)));h+=`<div class="tools"><input type="search" id="bq" placeholder="Search commands…" value="${esc(S.bookQ)}" aria-label="Search commands">${cats.map(c=>`<button class="btn sm ${S.bookCat===c?'pink':'ghost'}" data-cat="${c}">${c}</button>`).join('')}</div><div class="cgrid">`;
  list.forEach(x=>{h+=`<div class="card cmd"><h3><code>${esc(x.n)}</code><span class="pill">${x.c}</span></h3><p>${esc(x.d)}</p><pre>${esc(x.ex)}</pre>${x.f.length?`<ul>${x.f.map(([k,v])=>`<li><code>${esc(k)}</code> ${esc(v||'')}</li>`).join('')}</ul>`:''}${x.tip?`<div class="tp">💡 ${esc(x.tip)}</div>`:''}${x.sim?`<button class="btn sm mint" data-try="${esc(x.ex)}">Try it in the sandbox</button>`:'<span class="pill">concept-only here</span>'}</div>`;});if(!list.length)h+='<p>No commands match.</p>';h+='</div>';}
 else if(S.bookTab==='concepts')h+='<div class="cgrid">'+CONCEPTS.map(c=>`<div class="card concept"><div class="big">${c.e}</div><h3>${esc(c.t)}</h3><p style="font-weight:600;margin:4px 0">${esc(c.x)}</p><div class="an">💭 ${esc(c.a)}</div></div>`).join('')+'</div>';
 else h+=`<div class="card" style="max-width:760px"><h3>Assumed basics</h3><p style="font-weight:600">Ops Arena skips these and uses them freely: <code>cd ls pwd mkdir cp mv rm touch cat less head tail nano vim find grep locate</code>. They all work in the terminal. Start from the Missions map; everything else builds on them.</p></div>`;
 $('#v-book').innerHTML=h;}
function startQuiz(wid){S.quiz={w:wid,i:0,score:0,answered:false};renderQuiz();setView('quiz');}
function renderQuiz(){const z=S.quiz,w=WORLDS.find(x=>x.id===z.w),qs=QUIZ[z.w];
 if(z.i>=qs.length){const prev=P.quiz[z.w]||0;const gain=Math.max(0,z.score-prev)*20;if(P.quiz[z.w]===undefined||z.score>prev){P.quiz[z.w]=z.score;saveProg();}if(gain)addXP(gain);if(z.score===qs.length)confetti();$('#v-quiz').innerHTML=`<div class="card quiz" style="text-align:center"><div class="bob" style="display:inline-block;width:110px">${penny(z.score>=2?'cheer':'think')}</div><h2>${w.e} ${w.n}: ${z.score}/${qs.length}</h2><p style="font-weight:800">${z.score===qs.length?'Flawless! 👑':z.score>=2?'Nice work!':'Retry after a few more missions!'} ${gain?`+${gain} XP`:''}</p><div class="row" style="justify-content:center"><button class="btn mint" data-qz="again">Try again</button><button class="btn ghost" data-go="map">Back to missions</button></div></div>`;return;}
 const q=qs[z.i];$('#v-quiz').innerHTML=`<div class="card quiz"><span class="pill" style="background:${w.col};color:#13203a">${w.e} ${w.n} · question ${z.i+1}/${qs.length}</span><h3 style="margin:10px 0 4px;font-size:1.25rem">${esc(q.q)}</h3>${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}<div id="qfb"></div></div>`;}
function answerQuiz(i){const z=S.quiz;if(z.answered)return;z.answered=true;const q=QUIZ[z.w][z.i];const ok=i===q.a;if(ok)z.score++;document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong');});$('#qfb').innerHTML=`<p style="font-weight:800;margin:10px 0">${ok?'✅ Correct!':'❌ Not quite.'} ${esc(q.x)}</p><button class="btn mint" data-qz="next">${z.i+1>=QUIZ[z.w].length?'See result':'Next'}</button>`;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-q]');if(!t)return;
 if(t.id==='brand'){go('map');return;}if(t.dataset.view){go(t.dataset.view);return;}if(t.dataset.go){go(t.dataset.go);return;}if(t.dataset.q){startQuest(t.dataset.q);return;}if(t.dataset.quiz){startQuiz(t.dataset.quiz);return;}
 if(t.dataset.ins!==undefined){insert(t.dataset.ins);return;}if(t.dataset.tab){S.tab=t.dataset.tab;renderPanel();return;}if(t.dataset.btab){S.bookTab=t.dataset.btab;renderBook();return;}if(t.dataset.cat){S.bookCat=t.dataset.cat;renderBook();return;}
 if(t.dataset.fs){S.fsSel=t.dataset.fs;renderBook();return;}if(t.dataset.fsmap){S.bookTab='fs';go('book');return;}
 if(t.dataset.try){startSandbox(false);insert(t.dataset.try);return;}if(t.dataset.opt!==undefined){answerQuiz(+t.dataset.opt);return;}
 if(t.dataset.qz){if(t.dataset.qz==='again')startQuiz(S.quiz.w);else{S.quiz.i++;S.quiz.answered=false;renderQuiz();}return;}
 if(t.dataset.m){const a=t.dataset.m;closeModal();if(a==='next')startQuest(t.dataset.id);else if(a==='map')go('map');return;}
 if(t.dataset.chaos!==undefined){const id=t.dataset.chaos;if(!id){startSandbox(true);}else{const q=QUESTS.find(x=>x.id===id);const u=W.user,c=W.cwd;try{q.setup();}catch(er){}W.user=u;W.cwd=c;note_line(`💣 chaos injected: ${q.t.replace(/^🚨 /,'')}. Find it, then fix it.`);renderAll();}return;}
 if(t.id==='resetProg'){if(t.dataset.arm){P={xp:0,done:{},quiz:{}};saveProg();updateHeader();renderMap();}else{t.dataset.arm='1';t.textContent='Click again to erase everything';}return;}
 if(t.id==='run'){const i=$('#cmd');const v=i.value;i.value='';exec(v);liveExplain('');i.focus();return;}
 const a=t.dataset.act;if(a){if(a==='hint')showHint();else if(a==='restart')startQuest(S.quest.id);else if(a==='map')go('map');}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#cmd').addEventListener('keydown',e=>{const i=e.target;
 if(e.key==='Enter'){const v=i.value;i.value='';exec(v);liveExplain('');}
 else if(e.key==='ArrowUp'){e.preventDefault();if(S.hi>0){S.hi--;i.value=S.hist[S.hi]||'';liveExplain(i.value);}}
 else if(e.key==='ArrowDown'){e.preventDefault();if(S.hi<S.hist.length-1){S.hi++;i.value=S.hist[S.hi];}else{S.hi=S.hist.length;i.value='';}liveExplain(i.value);}
 else if(e.key==='Tab'){e.preventDefault();complete();}
 else if(e.key==='c'&&e.ctrlKey){e.preventDefault();if(i.value||S.buf){echoLine(i.value+'^C',!!S.buf);S.buf='';i.value='';renderPrompt();liveExplain('');}}
 else if(e.key==='l'&&e.ctrlKey){e.preventDefault();$('#tout').innerHTML='';}});
$('#cmd').addEventListener('input',e=>liveExplain(e.target.value));
document.addEventListener('input',e=>{if(e.target.id==='bq'){S.bookQ=e.target.value;const pos=e.target.selectionStart;renderBook();const n=$('#bq');n.focus();n.setSelectionRange(pos,pos);}});

/* ---------- boot ---------- */
$('#logo').innerHTML=penny('happy');renderChips();updateHeader();renderMap();setView('map');
</script></body></html>
